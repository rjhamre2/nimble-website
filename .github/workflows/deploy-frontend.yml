name: Deploy Frontend

on:
  push:
    branches: ["master", "prod"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # Skip deployment for prod branch if deploy flag is not set
    if: github.ref == 'refs/heads/master' || (github.ref == 'refs/heads/prod' && vars.DEPLOY_TO_PROD == 'true')
    env:
      BUILD_DIR: build
      # Set DEPLOY_FLAG from repository secret/variable (for use in steps)
      DEPLOY_FLAG: ${{ secrets.DEPLOY_TO_PROD || vars.DEPLOY_TO_PROD || '' }}
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      # --- 1. Continuous Integration (CI) / Build Phase ---

      - name: 🛠️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Static Assets
        # IMPORTANT: This sets the environment variable BUILD_DIR for subsequent steps
        run: npm run build
        env:
          CI: false
          BUILD_DIR: build # The folder containing the final static files
          REACT_APP_GOOGLE_CLIENT_ID: "919316988485-au1an6s2v1j3sfh9n163ehb728hkd661.apps.googleusercontent.com"
          REACT_APP_DASHBOARD2EC2LAMBDA_BASE_URL: "https://ody56t5fxdrceaqfxnfph2u3j40pamar.lambda-url.ap-south-1.on.aws"
          REACT_APP_AUTH_LAMBDA_BASE_URL: "https://api.nimbleai.in/api/auth"
          REACT_APP_WA_ES_LAMBDA: "https://ozpmzjnghswkf5fzen5rqle7p40wnxrk.lambda-url.ap-south-1.on.aws"
          REACT_APP_FRONTEND2FIREBASE: "https://api.nimbleai.in/api/business"
          REACT_APP_PRICING_LAMBDA: "https://api.nimbleai.in/api/pricing"
          REACT_APP_WEBSOCKET_API_GATEWAY: "wss://s687z96fob.execute-api.ap-south-1.amazonaws.com/prod"
          REACT_APP_RP_ID: "rzp_live_RWPVPdgjJN0s7P"
      # --- 2. Continuous Delivery (CD) to AWS ---

      - name: 🔐 Configure AWS Credentials
        # This action uses OIDC authentication (id-token: write)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔎 Verify AWS identity
        run: |
          aws sts get-caller-identity
          aws s3 ls s3://${{ vars.S3_BUCKET_NAME }} || true

      - name: 🚀 Deploy to S3 (Sync build files)
        run: |
          aws s3 sync "${BUILD_DIR}/" "s3://${{ vars.S3_BUCKET_NAME }}/" \
            --follow-symlinks --delete --cache-control max-age=86400

      - name: 💨 Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: 📧 Send Success Notification
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Frontend Deployment Successful - NimbleAI"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            🎉 Frontend deployment completed successfully!
            
            📊 Deployment Details:
            • Repository: ${{ github.repository }}
            • Branch: ${{ github.ref_name }}
            • Commit: ${{ github.sha }}
            • Author: ${{ github.actor }}
            • Timestamp: ${{ github.event.head_commit.timestamp }}
            • Workflow: ${{ github.workflow }}
            • Run ID: ${{ github.run_id }}
            
            🚀 Deployment Actions:
            • ✅ Code checkout completed
            • ✅ Dependencies installed
            • ✅ Static assets built
            • ✅ AWS credentials configured
            • ✅ Files synced to S3 bucket: ${{ vars.S3_BUCKET_NAME }}
            • ✅ CloudFront cache invalidated
            
            🔗 View the deployment: https://${{ vars.S3_BUCKET_NAME }}.s3-website.${{ vars.AWS_REGION }}.amazonaws.com
            
            Best regards,
            NimbleAI Deployment Bot 🤖

      - name: 📧 Send Failure Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Frontend Deployment Failed - NimbleAI"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            🚨 Frontend deployment failed!
            
            📊 Deployment Details:
            • Repository: ${{ github.repository }}
            • Branch: ${{ github.ref_name }}
            • Commit: ${{ github.sha }}
            • Author: ${{ github.actor }}
            • Timestamp: ${{ github.event.head_commit.timestamp }}
            • Workflow: ${{ github.workflow }}
            • Run ID: ${{ github.run_id }}
            
            🔍 Please check the GitHub Actions logs for more details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ⚠️ Common failure reasons:
            • Build errors in the React application
            • AWS credentials or permissions issues
            • S3 bucket access problems
            • CloudFront distribution issues
            • Environment variable misconfigurations
            
            Best regards,
            NimbleAI Deployment Bot 🤖